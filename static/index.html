<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Almoxarifado</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #222240;
    --accent: #e8ff47;
    --accent2: #47d4ff;
    --danger: #ff4757;
    --warn: #ffa502;
    --ok: #2ed573;
    --text: #f0f0f8;
    --muted: #8888aa;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* Header */
  header {
    background: var(--surface);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  h1 span { color: var(--accent); }

  .header-stats {
    display: flex;
    gap: 12px;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
  }

  .stat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }

  .dot-ok { background: var(--ok); }
  .dot-busy { background: var(--danger); }

  /* Barra de adicionar */
  .add-bar {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { border-color: var(--accent); }

  .btn-add {
    background: var(--accent);
    color: #0f0f1a;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 16px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    white-space: nowrap;
  }

  .btn-add:active { transform: scale(0.95); opacity: 0.85; }

  /* Filtros */
  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    background: var(--surface);
    border: 1.5px solid var(--surface2);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f0f1a;
  }

  /* Lista */
  .list {
    padding: 8px 16px 120px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.05);
    animation: slideIn 0.25s ease;
    transition: transform 0.15s;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-nome {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    font-weight: 700;
    flex: 1;
    padding-right: 10px;
    word-break: break-word;
  }

  .badge {
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    white-space: nowrap;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }

  .badge-ok { background: rgba(46,213,115,0.15); color: var(--ok); }
  .badge-busy { background: rgba(255,71,87,0.15); color: var(--danger); }

  .card-info {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .card-info strong { color: var(--text); font-weight: 500; }

  .card-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 8px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    letter-spacing: 0.2px;
  }

  .btn:active { transform: scale(0.95); opacity: 0.8; }

  .btn-retirar { background: var(--warn); color: #1a1000; }
  .btn-devolver { background: var(--accent2); color: #001a20; }
  .btn-remover { background: rgba(255,71,87,0.15); color: var(--danger); flex: 0 0 auto; padding: 10px 12px; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-icon { font-size: 52px; margin-bottom: 12px; }
  .empty-text { font-size: 16px; }

  /* FAB Relatório */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 20px;
    left: 20px;
    background: var(--surface);
    border: 1.5px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  .fab:active { transform: scale(0.97); }
  .fab span { color: var(--accent); font-size: 16px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    backdrop-filter: blur(4px);
  }

  .overlay.show { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .overlay.show .modal { transform: translateY(0); }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }

  .modal input {
    width: 100%;
    margin-bottom: 12px;
    padding: 12px 14px;
    font-size: 16px;
  }

  .modal-actions { display: flex; gap: 10px; }

  .btn-confirm {
    flex: 1;
    background: var(--accent);
    color: #0f0f1a;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .btn-confirm:active { transform: scale(0.97); }

  .btn-cancel {
    background: var(--surface2);
    color: var(--muted);
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 13px 18px;
    cursor: pointer;
  }

  /* Modal relatório */
  .relatorio-text {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    white-space: pre-wrap;
    max-height: 50dvh;
    overflow-y: auto;
    margin-bottom: 14px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 999;
    white-space: nowrap;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: var(--ok); color: var(--ok); }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Almox<span>.</span></h1>
    <div class="header-stats">
      <div class="stat-pill"><div class="stat-dot dot-ok"></div><span id="cnt-ok">0</span> livres</div>
      <div class="stat-pill"><div class="stat-dot dot-busy"></div><span id="cnt-busy">0</span> retirados</div>
    </div>
  </div>
  <div class="add-bar">
    <input type="text" id="input-nome" placeholder="Nome do produto..." maxlength="80">
    <button class="btn-add" onclick="adicionarProduto()">+ Adicionar</button>
  </div>
</header>

<div class="filters">
  <button class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
  <button class="filter-btn" onclick="setFiltro('disponivel', this)">✅ Disponíveis</button>
  <button class="filter-btn" onclick="setFiltro('indisponivel', this)">❌ Retirados</button>
</div>

<div class="list" id="lista">
  <div class="loading">Carregando...</div>
</div>

<button class="fab" onclick="abrirRelatorio()">
  <span>📊</span> Exportar Relatório
</button>

<!-- Modal Retirada -->
<div class="overlay" id="modal-retirada" onclick="fecharModal('modal-retirada')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2>Retirar produto</h2>
    <p id="modal-retirada-nome"></p>
    <input type="text" id="input-quem" placeholder="Seu nome..." maxlength="60">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModal('modal-retirada')">Cancelar</button>
      <button class="btn-confirm" onclick="confirmarRetirada()">Confirmar retirada</button>
    </div>
  </div>
</div>

<!-- Modal Relatório -->
<div class="overlay" id="modal-relatorio" onclick="fecharModal('modal-relatorio')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2>📊 Relatório</h2>
    <div class="relatorio-text" id="relatorio-text"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModal('modal-relatorio')">Fechar</button>
      <button class="btn-confirm" onclick="copiarRelatorio()">Copiar texto</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  let produtos = [];
  let filtro = 'todos';
  let produtoRetirandoId = null;

  // ── API ───────────────────────────────────────────────────────────
  async function api(path, method = 'GET', body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api' + path, opts);
    return res.json();
  }

  // ── Carregar ──────────────────────────────────────────────────────
  async function carregar() {
    produtos = await api('/produtos');
    renderizar();
  }

  // ── Renderizar ────────────────────────────────────────────────────
  function renderizar() {
    const lista = document.getElementById('lista');
    const disp = produtos.filter(p => p.disponivel);
    const indisp = produtos.filter(p => !p.disponivel);

    document.getElementById('cnt-ok').textContent = disp.length;
    document.getElementById('cnt-busy').textContent = indisp.length;

    let filtrados = produtos;
    if (filtro === 'disponivel') filtrados = disp;
    if (filtro === 'indisponivel') filtrados = indisp;

    if (filtrados.length === 0) {
      lista.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📦</div>
          <div class="empty-text">Nenhum produto aqui</div>
        </div>`;
      return;
    }

    lista.innerHTML = filtrados.map(p => `
      <div class="card" id="card-${p.id}">
        <div class="card-header">
          <div class="card-nome">${escHtml(p.nome)}</div>
          <span class="badge ${p.disponivel ? 'badge-ok' : 'badge-busy'}">
            ${p.disponivel ? 'Disponível' : 'Retirado'}
          </span>
        </div>
        ${!p.disponivel ? `
          <div class="card-info">
            <strong>${escHtml(p.quem_retirou)}</strong><br>
            ${escHtml(p.data_retirada)}
          </div>` : ''}
        <div class="card-actions">
          ${p.disponivel
            ? `<button class="btn btn-retirar" onclick="abrirRetirada(${p.id})">🔧 Retirar</button>`
            : `<button class="btn btn-devolver" onclick="devolverProduto(${p.id})">🔄 Devolver</button>`
          }
          <button class="btn btn-remover" onclick="removerProduto(${p.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  // ── Adicionar ─────────────────────────────────────────────────────
  async function adicionarProduto() {
    const inp = document.getElementById('input-nome');
    const nome = inp.value.trim();
    if (!nome) { toast('Digite o nome do produto', 'err'); return; }

    const res = await api('/produtos', 'POST', { nome });
    if (res.erro) { toast(res.erro, 'err'); return; }

    inp.value = '';
    await carregar();
    toast('Produto adicionado! ✅', 'ok');
  }

  // ── Retirada ──────────────────────────────────────────────────────
  function abrirRetirada(id) {
    produtoRetirandoId = id;
    const p = produtos.find(x => x.id === id);
    document.getElementById('modal-retirada-nome').textContent = `Produto: ${p.nome}`;
    document.getElementById('input-quem').value = '';
    abrirModal('modal-retirada');
    setTimeout(() => document.getElementById('input-quem').focus(), 350);
  }

  async function confirmarRetirada() {
    const quem = document.getElementById('input-quem').value.trim();
    if (!quem) { toast('Informe seu nome', 'err'); return; }

    const res = await api(`/produtos/${produtoRetirandoId}/retirar`, 'POST', { quem });
    if (res.erro) { toast(res.erro, 'err'); return; }

    fecharModal('modal-retirada');
    await carregar();
    toast(`Retirado por ${quem} ✅`, 'ok');
  }

  // ── Devolver ──────────────────────────────────────────────────────
  async function devolverProduto(id) {
    const res = await api(`/produtos/${id}/devolver`, 'POST');
    if (res.erro) { toast(res.erro, 'err'); return; }
    await carregar();
    toast('Produto devolvido 🔄', 'ok');
  }

  // ── Remover ───────────────────────────────────────────────────────
  async function removerProduto(id) {
    if (!confirm('Tem certeza que deseja remover este produto?')) return;
    const res = await api(`/produtos/${id}`, 'DELETE');
    if (res.erro) { toast(res.erro, 'err'); return; }
    await carregar();
    toast('Produto removido 🗑️', 'ok');
  }

  // ── Relatório ─────────────────────────────────────────────────────
  async function abrirRelatorio() {
    const res = await api('/relatorio');
    if (res.erro) { toast(res.erro, 'err'); return; }
    document.getElementById('relatorio-text').textContent = res.relatorio;
    abrirModal('modal-relatorio');
  }

  function copiarRelatorio() {
    const txt = document.getElementById('relatorio-text').textContent;
    navigator.clipboard.writeText(txt).then(() => toast('Copiado! 📋', 'ok'));
  }

  // ── Filtro ────────────────────────────────────────────────────────
  function setFiltro(f, btn) {
    filtro = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderizar();
  }

  // ── Modal helpers ─────────────────────────────────────────────────
  function abrirModal(id) { document.getElementById(id).classList.add('show'); }
  function fecharModal(id) { document.getElementById(id).classList.remove('show'); }

  // ── Toast ─────────────────────────────────────────────────────────
  function toast(msg, tipo = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${tipo} show`;
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── Escape HTML ───────────────────────────────────────────────────
  function escHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // ── Enter no input principal ──────────────────────────────────────
  document.getElementById('input-nome').addEventListener('keydown', e => {
    if (e.key === 'Enter') adicionarProduto();
  });

  document.getElementById('input-quem').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmarRetirada();
  });

  // ── Iniciar ───────────────────────────────────────────────────────
  carregar();
</script>
</body>
</html>
